<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDC Layout Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An isometric, layer-by-layer explorer of an AI data center campus: yard, grey space, white space and the rack, with power, cooling, water, network, fire and structural layers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: product-drawing aesthetic — near-white hardware outlined in ink on a pale grey stage with a diamond grid; serif headline, mono annotations; colour only for system flows, status LEDs and the one selected part */
:root{
  /* palette: wantinghsu.com "Paper" theme; system lines kept by meaning, saturation lowered to sit on paper */
  --paper:#f3f4f6; --stage:#ffffff; --card:#ffffff; --ink:#0e1116; --ink-2:#4b5661; --ink-3:#4f5b67; --line:#0e111624; --line-2:#0e111647; --panel:#e6e9ee;
  --btn:#0e6f86; --btn-h:#0b5a6d;
  --power:#3a5f9e; --heat:#c2603f; --cold:#4f8fb4; --water:#2f8a84; --net:#7464a8; --fire:#b55050; --struct:#9a7a3e; --gen:#a8863f; --batt:#5f8a4e; --led:#7cc242; --accent:#9c4a0d; --line-art:#3d8fd6;
  --f-display:"Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Geist Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink);text-underline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
/* header */
header.bar{display:flex;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;padding-block:16px 14px}
.brand{display:grid;gap:6px;margin-right:auto;min-width:0;max-width:860px}
.pill{justify-self:start;font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:2px 11px;color:var(--ink)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(24px,2.4vw,32px);line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.brand .sub{margin:0;font-size:14.5px;color:var(--ink-2);max-width:64ch}
.sheet .case{border-left:2px solid var(--line-2);padding:2px 0 2px 12px}.sheet .case b{font-size:13px}.sheet .case p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.brand .by{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.brand .by .lk{color:var(--ink-3)}
.brand .by a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.hctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cta{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--ink);color:#fff;border-radius:4px;padding:9px 14px;font-size:13.5px;font-weight:500}
.cta span[aria-hidden]{font-size:15px}
/* work area */
main.work{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;gap:18px;min-height:0;padding-block:4px 12px}
.panel{min-height:0;overflow:auto;display:grid;gap:26px;align-content:start;scrollbar-width:thin}
.ph{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.ph .n{color:var(--ink-3);font-weight:500}
.ph .q{margin-left:auto;font:400 11px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.psec{padding-top:16px;border-top:1px solid var(--ink)}
.psec:first-child{padding-top:0;border-top:0}
.levels{display:grid;gap:2px}
.lv{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 6px}
.lv .code{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.lv b{font-weight:500;font-size:13.5px;display:block;line-height:1.3}
.lv small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.lv:hover{background:var(--panel)}
.lv[aria-pressed="true"]{background:var(--panel)}
.lv[aria-pressed="true"] .code{color:var(--accent)}
.lv[aria-pressed="true"] b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.rooms{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 4px 36px}
.rooms button{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
.rooms button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
.layers{display:grid;gap:0}
.ly{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;font-size:13.5px;cursor:pointer;user-select:none}
.ly:hover{background:var(--panel)}
.ly input{accent-color:var(--ink);margin:0}
.lyw{display:grid;gap:1px}
.keys{display:flex;flex-wrap:wrap;gap:2px 10px;margin:0 0 4px 30px;font-size:11.5px;color:var(--ink-2)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys.off{opacity:.4}
.ly .en2{margin-left:auto;font:400 11px var(--f-mono);color:var(--ink-3)}
.scn{display:grid;gap:12px}
.sc{display:grid;gap:5px}
.sc .t{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.sc .t button{border:0;background:none;padding:0;color:var(--ink-3);font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.sc .seg{width:100%}.sc .seg button{flex:1}
.outbtn{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ink);color:var(--ink);background:var(--paper);border-radius:4px;padding:8px 12px;font-weight:500;font-size:13px;text-align:left}
.outbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.linkbtn{border:0;background:none;padding:0;font-size:12.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;justify-self:start}
/* stage */
.stage{position:relative;min-height:0;border-radius:6px;overflow:hidden;background:var(--stage);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#paths polyline{fill:none;stroke-linejoin:round;stroke-linecap:round}
#paths .flow{stroke-width:2;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
#paths .base{stroke-width:5;stroke-opacity:.12}
#paths .lost{stroke:#b5b5b0!important;animation:none;stroke-dasharray:2 5;stroke-opacity:.9}
#paths .idle{stroke-dasharray:2 6;animation:none;stroke-opacity:.6}
#paths .slow{animation-duration:3.2s;stroke-opacity:.45}
#paths .fire{stroke-dasharray:2 4;animation:none;stroke-width:1.6}
#paths .leader{stroke:#8f8f8a;stroke-width:1;fill:none}
#paths .ldot{fill:#8f8f8a}
#paths .ring{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:2 4}
#paths .core{fill:var(--accent)}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes spin{to{stroke-dashoffset:-60}}
#paths .ring{animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){#paths .flow,#paths .ring{animation:none}}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:grid;justify-items:center;white-space:nowrap}
.lb span{display:block;font-size:12px;font-weight:500;color:var(--ink);line-height:1.25;text-align:left;background:#fff;border:1px solid #8f8f8a;border-radius:4px;padding:2px 6px 3px}
.lb span small{display:block;font:400 10px var(--f-mono);color:var(--ink-2)}
.lb span .sd{display:none}
.lb i{width:1px;height:var(--lead,12px);background:#8f8f8a}
.lb.zone span{border-color:var(--ink);border-radius:999px;padding:2px 10px 3px}
.lb.sel span{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lb.sel i{background:var(--accent)}
.lb.hot span{border-color:var(--fire);color:var(--fire)}
.lb.hov span{border-color:var(--ink)}
.lb.side{transform:none;display:block;white-space:normal}
.lb.side i{display:none}
.lb.side span{padding:8px 10px;font-size:13px}
.lb.side span small{display:inline;margin-left:6px}
.lb.side span .sd{display:block;font-size:12px;color:var(--ink-2);font-weight:400;line-height:1.5;margin-top:3px;font-style:normal}
.crumb{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font:400 12px var(--f-mono);max-width:calc(100% - 28px)}
.crumb button{border:0;background:none;padding:0;color:var(--ink-2)}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.crumb button:last-child{color:var(--ink)}
.crumb .sep{color:var(--ink-3)}
.ctrls{position:absolute;right:12px;bottom:12px;display:grid;gap:6px;justify-items:end}
.ctrls button{width:34px;height:34px;border-radius:4px;border:1px solid var(--line-2);background:#fff;font-size:15px;line-height:1;color:var(--ink)}
.ctrls .explode{width:auto;padding:0 10px;font-size:12px}
.dash{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:5px;min-width:230px;font-size:12px}
.dash .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.dash .row span{color:var(--ink-2)}
.dash .row b{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.dash .big b{font:500 19px var(--f-mono);letter-spacing:-.01em}
.dash input[type=range]{width:100%;accent-color:var(--ink)}
.dash .note{font-size:10.5px;color:var(--ink-3);line-height:1.45;max-width:250px}
.dash .hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dash .hdr b{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.dash .hdr button{border:0;background:none;color:var(--ink-3);font-size:11.5px;padding:0;text-decoration:underline}
.toast{position:absolute;right:14px;top:14px;width:min(400px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(22,22,22,.08);z-index:4}
.toast .th{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.toast .th b{font:600 17px/1.3 var(--f-display)}
.toast .th span{font:400 11.5px var(--f-mono);color:var(--ink-3)}
.toast .kick{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.toast p{margin:0;font-size:13.5px;color:var(--ink-2)}
.toast .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.toast .src{font-size:11px;color:var(--ink-3)}
.toast .sub2{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}
.toast .kr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast .mini{display:flex;gap:6px}
.rbtn.sm{width:30px;height:30px;font-size:14px}
.xbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:16px;line-height:1;display:inline-grid;place-items:center;flex:none;margin:-4px -4px 0 0}
.xbtn:hover{border-color:var(--ink)}
.rbtn{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;border:0;font-size:17px;display:inline-grid;place-items:center;flex:none}
.rbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
.tbtn{border:0;background:none;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.hint{position:absolute;right:58px;bottom:14px;font:400 11px var(--f-mono);color:var(--ink-3)}
/* architecture sheet */
.cards{position:absolute;right:14px;top:14px;width:min(400px,calc(100% - 28px));display:grid;gap:10px;z-index:4;pointer-events:none}
.cards .toast{position:static;width:auto;pointer-events:auto}
.cards.over{z-index:7;top:auto;bottom:24px;right:28px}
.sheet{position:absolute;inset:10px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;padding:20px 22px 22px;display:block;z-index:6}
.sheet>*+*{margin-top:16px}
.sheet .sh-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.sheet h2{margin:8px 0 4px;font:600 clamp(20px,2.1vw,26px)/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.sheet .lede{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch}
.sheet .dia{overflow-x:auto}
.sheet .dia svg{display:block;width:100%;min-width:640px;height:auto}
.gens3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.gens3 div{display:grid;gap:4px;align-content:start}
.gens3 b{font-size:14px}
.gens3 .k{font:500 11px var(--f-mono);color:var(--line-art);letter-spacing:.06em;text-transform:uppercase}
.gens3 p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px;border-top:1px solid var(--line);padding-top:12px}
.legend div{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.legend b{color:var(--ink);font-weight:500}
.sheet .srcs{border-top:1px solid var(--line);padding-top:10px}
/* info card */
.card{display:grid;gap:14px}
.card .nm{display:grid;gap:4px}
.card .nm h2{margin:0;font:600 21px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.card .nm .alt{font:400 12px var(--f-mono);color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid var(--line-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tag i{width:12px;height:0;border-top:2px dashed}
.card p{margin:0;font-size:13.5px;line-height:1.7}
.card .sh{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:var(--paper);border-radius:4px;padding:3px 9px;font-size:12.5px}
.chips button::after{content:" →";color:var(--ink-3)}
.chips button:hover{border-color:var(--ink)}
.chips .none{font-size:12px;color:var(--ink-3)}
.pmq{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.pmbox{background:var(--panel);border-radius:6px;padding:12px 14px}
.srcs{margin:0;padding-left:16px;font-size:12px;display:grid;gap:4px}
.srcs a{color:var(--ink-2)}
.empty{display:grid;gap:12px;color:var(--ink-2);font-size:13.5px}
.empty h2{margin:0;font:600 19px/1.3 var(--f-display);color:var(--ink)}
.empty ol{margin:0;padding-left:18px;display:grid;gap:7px}
.foot{font:400 11.5px var(--f-mono);color:var(--ink-3);padding-block:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between}
@media (max-width:1180px){main.work{grid-template-columns:220px minmax(0,1fr) 290px}}
@media (max-width:960px){
  html,body{height:auto}
  .app{height:auto;display:block}
  main.work{display:flex;flex-direction:column}
  .stage{height:64vh;min-height:400px;order:1}
  #ctl{order:2} #info{order:3}
  .panel{overflow:visible}
  .dash{min-width:0;max-width:calc(100% - 64px)}
  .dash .note{display:none}
  .cards{left:10px;right:10px;width:auto;top:auto;bottom:10px}
}
@media (max-width:520px){.hint{display:none}}
/* Paper theme: interactive fills take the site's interface blue; floating cards stay white on the grey page */
.seg button[aria-pressed="true"],.cta,.rbtn:not(.ghost){background:var(--btn);color:#fff}
.cta:hover,.rbtn:not(.ghost):hover{background:var(--btn-h)}
.outbtn[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.toast,.dash,.lb>span,.sheet,.outbtn:not([aria-pressed="true"]),.seg{background:var(--card)}
.brand h1 .tl{font-weight:400;color:var(--ink-2);margin-left:.45em}
</style>
</head>
<body>


<div class="app">
  <header class="bar">
    <div class="brand"><h1><span data-i="title"></span><span class="tl" data-i="tagline"></span></h1><p class="sub" data-i="subtitle"></p><p class="by"><a href="https://wantinghsu.com/lab/aidc-layout/">← Back to the study · wantinghsu.com</a></p></div>
    <div class="hctl">
      <div class="seg" role="group" aria-label="Language" id="langSeg"><button data-v="zh" aria-pressed="true">中文</button><button data-v="en" aria-pressed="false">EN</button></div>
      <button class="cta" id="tourBtn"><span data-i="tour"></span><span aria-hidden="true">→</span></button>
    </div>
  </header>

  <main class="work">
    <aside class="panel" id="ctl" aria-label="Controls">
      <section class="psec"><div class="ph"><span class="n">01</span><span data-i="hLevels"></span><span class="q" data-i="qLevels"></span></div><div class="levels" id="levels"></div></section>
      <section class="psec"><div class="ph"><span class="n">02</span><span data-i="hLayers"></span><span class="q" data-i="qLayers"></span></div><div class="layers" id="layers"></div></section>
      <section class="psec"><div class="ph"><span class="n">03</span><span data-i="hScen"></span><span class="q" data-i="qScen"></span></div><div class="scn" id="scen"></div></section>
    </aside>

    <section class="stage" id="stage" aria-label="Isometric model">
      <canvas id="gl"></canvas>
      <svg id="paths" aria-hidden="true"></svg>
      <div id="labels"></div>
      <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
      <div class="dash" id="dash"></div>
      <div class="ctrls">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="rotL" aria-label="Rotate left">↺</button>
        <button id="rotR" aria-label="Rotate right">↻</button>
        <button id="reset" aria-label="Reset view">⌂</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="cards" id="cards"><div class="toast" id="toast" hidden></div><div class="toast ocard" id="ocard" hidden></div></div>
      <div class="sheet" id="arch" hidden></div>
    </section>

    <aside class="panel" id="info" aria-label="Component sheet"></aside>
  </main>
  <footer class="foot"><span data-i="disclaimer"></span><span data-i="credit"></span></footer>
</div>

<script src="vendor/three.min.js"></script>
<script>
/* ============================================================
   DATA — sources, UI strings, component catalogue, relations
   Every factual statement in a component card cites SRC keys.
   Layout geometry is illustrative (not any real site).
   ============================================================ */
const SRC={
  uptime25:{t:"Uptime Institute — Global Data Center Survey 2025",u:"https://datacenter.uptimeinstitute.com/rs/711-RIA-145/images/2025.Annual.Survey.Report.pdf?version=0"},
  tier:{t:"Uptime Institute Journal — Tier Classification System",u:"https://journal.uptimeinstitute.com/?p=3737"},
  nv800:{t:"NVIDIA Technical Blog — 800 VDC Architecture",u:"https://developer.nvidia.com/blog/nvidia-800-v-hvdc-architecture-will-power-the-next-generation-of-ai-factories/"},
  gb300:{t:"NVIDIA — GB300 NVL72",u:"https://www.nvidia.com/en-us/data-center/gb300-nvl72/"},
  se132:{t:"DCD — Schneider Electric × NVIDIA GB200 NVL72 reference design",u:"https://datacenterdynamics.com/en/news/schneider-electric-co-develops-gb200-nvl72-reference-architecture-with-nvidia"},

rack:{z:"white",s:"power",lv:[3],room:"hall",n:{zh:"AI 機櫃",en:"AI rack"},

busway:{z:"white",s:"power",lv:[3],room:"hall",n:{zh:"匯流排槽",en:"Busway"},

noc:{z:"support",s:"fire",lv:[3],room:"support",n:{zh:"監控中心 NOC／SOC",en:"Network & security operations center"},

function fitScale(){const r=stage.getBoundingClientRect(); const a=r.width/Math.max(1,r.height); return a<1.25?1.25/Math.max(.55,a):1;}
function camDir(){return V(Math.cos(EL)*Math.cos(cam.az),Math.sin(EL),Math.cos(EL)*Math.sin(cam.az));}

 camera.left=-cam.size*a/2; camera.right=cam.size*a/2; camera.top=cam.size/2; camera.bottom=-cam.size/2;

}

  <div><div class="sh">${esc(T(UI.sources))}</div>${srcList(c.src)}</div>
 </div>`;
 el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go,true));
 const ab=el.querySelector("[data-arch]"); if(ab) ab.onclick=()=>openArch(true);
}
function showScn(k){S.scnCard=k; S.sel=null; renderInfo(); renderCrumb();}

/* level of a component (for "go to") */
function levelOf(id){const c=C[id]; if(c.lv.includes(4)) return {level:4}; if(c.zone) return {level:2}; if(c.lv.includes(0)) return {level:S.level<=1?S.level:0}; return {level:3,room:c.room};}
function select(id,fly){
 S.scnCard=null; S.sel=id;
 if(id&&fly){
  const c=C[id]; const here=c.lv.includes(S.level)&&(S.level!==3||c.room===S.room);
  if(!here){const L=levelOf(id); S.level=L.level; if(L.room) S.room=L.room; renderLevels(); flyLevel(); updateExplodeBtn();}
  else if(S.level!==4){const a=ANCHOR[id]; if(a) flyTo(V(a.x,0,a.z),cam.size);}
 }
 applyPull(id);
 renderInfo(); renderCrumb();
}
function setLevel(l){
 S.level=l; if(S.sel&&!labelShown(S.sel)) S.sel=null;
 renderLevels(); renderCrumb(); renderInfo(); renderDash(); writeHash(); flyLevel();
 updateExplodeBtn();
}
function renderAll(fly){renderLevels();renderLayers();renderScen();renderCrumb();renderDash();renderInfo();renderArch(); writeHash(); if(fly) flyLevel();}
function hashName(){return S.level===3?("l3-"+S.room):("l"+S.level);}
function writeHash(){const h=hashName(); if(location.hash.slice(1)!==h){try{history.replaceState(null,"","#"+h);}catch(e){}}}
function readHash(){const m=/^l([0-4])(?:-(elec|hall|cup|support))?$/.exec(location.hash.slice(1)); if(m){S.level=+m[1]; if(m[2]) S.room=m[2]; return true;} return false;}
window.addEventListener("hashchange",()=>{if(readHash()){renderAll(true); updateExplodeBtn();}});

/* explode toggle (L1 roof / L4 rack) */
const ctr=document.querySelector(".ctrls"); const exB=document.createElement("button"); exB.className="explode"; ctr.insertBefore(exB,ctr.firstChild);
/* At L4, picking a tray-type part closes the rack and slides one representative drawer out of the front. */
function applyPull(id){
 const k=S.level===4&&id&&PULLIDX[id]!=null?id:null;
 if(k){S.pull=k; S.explode=false;} else S.pull=null;
 if(RACKPARTS.length) layoutRack(S.explode); try{updateExplodeBtn();}catch(e){}
}
function updateExplodeBtn(){exB.hidden=S.level!==4; exB.textContent=T(S.explode?UI.explodeOff:UI.explodeOn);}
exB.onclick=()=>{S.pull=null; S.explode=!S.explode; layoutRack(S.explode); updateExplodeBtn();};

/* outage storyboard */
let outTimer=null;
function startOutage(){S.outage=0; S.layers.power=true; if(S.level!==3||S.room!=="elec"){S.level=3;S.room="elec";} renderAll(true); renderToast();}
function stopOutage(){S.outage=null; clearInterval(outTimer); outTimer=null; renderAll(false); renderToast();}
function renderToast(){
 const el=$("toast"), oc=$("ocard"); $("cards").classList.toggle("over",S.tour!=null&&S.arch);
 // tour card
 if(S.tour!=null){const st=TOUR[S.tour]; el.hidden=false;
  el.innerHTML=`<div class="kr"><div class="kick">${esc(T(UI.stepK))} · ${S.tour+1} / ${TOUR.length}</div><button class="xbtn" id="tClose" aria-label="${esc(T(UI.close))}">×</button></div><div class="th"><b>${esc(T(st.t))}</b></div><p>${esc(T(st.p))}</p>
  <div class="acts"><button class="rbtn ghost" id="tPrev" aria-label="${esc(T(UI.prev))}">←</button><button class="rbtn" id="tNext" aria-label="${esc(T(UI.next))}">${S.tour===TOUR.length-1?"✓":"→"}</button></div>`;
  $("tPrev").onclick=()=>tourGo(Math.max(0,S.tour-1)); $("tClose").onclick=endTour; $("tNext").onclick=()=>S.tour===TOUR.length-1?endTour():tourGo(S.tour+1);
 } else {el.hidden=true; el.innerHTML="";}
 // outage card (same card whether started from the panel or from the tour)
 if(S.outage==null){oc.hidden=true; oc.innerHTML=""; return;}
 const o=OUTAGE[S.outage]; oc.hidden=false;
 const srcLine=`<div class="src">${esc(T({zh:"來源：",en:"Source: "}))}<a href="${SRC.uptime25.u}" target="_blank" rel="noopener">${esc(SRC.uptime25.t)}</a></div>`;
 oc.innerHTML=`<div class="kr"><div class="kick">${esc(T(UI.outK))} · ${S.outage+1} / ${OUTAGE.length}</div><button class="xbtn" id="oX" aria-label="${esc(T(UI.outageStop))}">×</button></div><div class="th"><b>${esc(T(o.t))}</b></div><p>${esc(T(o.p))}</p>${srcLine}
  <div class="acts"><button class="tbtn" id="oPlay">${esc(T(outTimer?UI.pause:UI.play))}</button><button class="rbtn ghost" id="oPrev" aria-label="${esc(T(UI.prev))}">←</button><button class="rbtn" id="oNext" aria-label="${esc(T(UI.next))}">→</button></div>`;
 $("oX").onclick=stopOutage;
 $("oPrev").onclick=()=>{S.outage=(S.outage+OUTAGE.length-1)%OUTAGE.length; renderToast();};
 $("oNext").onclick=()=>{S.outage=(S.outage+1)%OUTAGE.length; renderToast();};
 $("oPlay").onclick=()=>{ if(outTimer){clearInterval(outTimer);outTimer=null;} else outTimer=setInterval(()=>{S.outage=(S.outage+1)%OUTAGE.length; renderToast();},3600); renderToast();};
}

/* power-architecture sheet (redrawn from TI and Vertiv descriptions) */
SRC.ti={t:"Texas Instruments — Data centers evolve to meet AI's massive power needs (B. McDonald, 2025-11)",u:"https://www.ti.com.cn/lit/pdf/SSZTDB4"};
SRC.vtv800={t:"Vertiv — 800 VDC conversion boundary: three architecture models (2026-10-21)",u:"https://www.vertiv.com/en-us/insights/articles/blog-posts/800-vdc-conversion-boundary-three-architecture-models-for-mw-scale-ai-data-centers/"};
const ARCH={
 gens:[
  {k:{zh:"第二代 · 今日主流",en:"Gen 2 · today"},t:{zh:"機櫃內 AC/DC",en:"AC/DC inside the rack"},p:{zh:"13 kV 經變壓器降到 480 VAC，進機櫃的電源層轉成 50 VDC 匯流排，托盤上再降到 12 V。TI 指出實際約 100 kW，超過約 200 kW 就因配電損耗而不切實際。",en:"13 kV is stepped down to 480 VAC, power shelves in the rack make a 50 VDC busbar, and each tray converts to 12 V. TI puts realistic loads near 100 kW; above roughly 200 kW, distribution losses make it impractical."}},
  {k:{zh:"第三代 · 電源側櫃",en:"Gen 3 · sidecar"},t:{zh:"Power sidecar → 800 VDC",en:"Power sidecar → 800 VDC"},p:{zh:"電源層移到旁邊的電源櫃，輸出 800 VDC 或 ±400 VDC。在 1 MW 時，匯流排電流從約 20 kA 降到 1.25 kA，櫃內空間讓給運算。Vertiv 的電源櫃可供 600 kW 以上。",en:"Power shelves move into a rack beside the IT rack and output 800 VDC or ±400 VDC. At 1 MW, busbar current drops from about 20 kA to 1.25 kA, freeing rack space for compute. Vertiv's power racks supply over 600 kW."}},
  {k:{zh:"第四代 · 提案",en:"Gen 4 · proposal"},t:{zh:"設施端固態變壓器 SST",en:"Facility solid-state transformer"},p:{zh:"SST 一次取代中壓變壓器與整流，完成隔離與 AC→800 VDC，轉換移到灰區的多 MW 機組。轉換越集中，故障影響範圍也越大。",en:"An SST replaces both the MV transformer and the rectifiers in one stage — isolation plus AC→800 VDC — moving conversion into multi-MW units in the grey space. More centralised conversion also concentrates fault risk."}}
 ],
 legend:[
  ["LFT",{zh:"傳統鐵芯工頻變壓器（line-frequency transformer）。",en:"Conventional iron-core, line-frequency transformer."}],
  ["SST",{zh:"固態變壓器：以電力電子做隔離與交直流轉換。",en:"Solid-state transformer: isolation and AC/DC conversion done with power electronics."}],
  ["Power shelf",{zh:"電源層：把交流轉成機櫃用的直流。",en:"Converts AC to the rack's DC bus."}],
  ["Sidecar",{zh:"電源側櫃：放在 IT 機櫃旁、專門供電的機櫃。",en:"A dedicated power rack beside the IT rack."}],
  ["BBU",{zh:"電池備援單元：在市電恢復或發電機啟動前維持供電。",en:"Battery backup unit: holds the bus until utility returns or generators start."}],
  ["CBU",{zh:"電容備援單元：抑制停電瞬間的電壓與電流暫態。",en:"Capacitor backup unit: suppresses voltage and current transients."}],
  ["IBC",{zh:"中間匯流排轉換器：在托盤上把高壓匯流排降到 12／48／6 V。",en:"Intermediate bus converter: steps the bus down to 12, 48 or 6 V on each tray."}]
 ]
};
function archSVG(){
 const B="var(--line-art)", G="#8f8f8a", I="var(--ink)", O="var(--accent)";
 const tower=(x,y)=>`<path d="M${x-13} ${y+66}L${x} ${y}L${x+13} ${y+66}M${x-9} ${y+46}H${x+9}M${x-5} ${y+26}H${x+5}M${x-17} ${y+12}H${x+17}M${x-13} ${y+66}L${x+5} ${y+26}M${x+13} ${y+66}L${x-5} ${y+26}" stroke="${B}" fill="none" stroke-width="1.4"/>`;
 const cab=(x,y,w,h,lab,fins)=>{let f=""; for(let k=0;k<(fins||0);k++) f+=`<path d="M${x+w-14-k*7} ${y+16}V${y+h-12}" stroke="${B}" stroke-width="1"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#fff" stroke="${B}" stroke-width="1.4"/><path d="M${x} ${y+12}H${x+w}" stroke="${B}"/>${f}<text x="${x+10}" y="${y+h/2+4}" font-size="13" font-weight="600" fill="${I}">${lab}</text>`;};
 const rack=(x,y,w,h,shelves)=>{let r=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#fff" stroke="${B}" stroke-width="1.4"/><path d="M${x+6} ${y+4}V${y+h-4}M${x+w-6} ${y+4}V${y+h-4}" stroke="${B}" stroke-width="1"/>`;
  const n=shelves.length, sh=(h-16)/n; shelves.forEach((t,k)=>{const yy=y+8+k*sh; r+=`<rect x="${x+9}" y="${yy}" width="${w-18}" height="${sh-3}" fill="${t==="p"?"#fdebe3":"#fff"}" stroke="${t==="p"?O:B}" stroke-width="1"/>`;}); return r;};
 const arr=(x1,y1,x2,y2,lab,ly)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${G}" stroke-width="1.3" marker-end="url(#ah)"/>${lab?`<text x="${(x1+x2)/2}" y="${(ly??Math.min(y1,y2)-8)}" font-size="12" text-anchor="middle" fill="${I}" font-family="var(--f-mono)">${lab}</text>`:""}`;
 const elbow=(pts,lab,lx,ly)=>`<polyline points="${pts}" fill="none" stroke="${G}" stroke-width="1.3" marker-end="url(#ah)"/>${lab?`<text x="${lx}" y="${ly}" font-size="12" fill="${I}" font-family="var(--f-mono)">${lab}</text>`:""}`;
 const tag=(x,y,t)=>`<text x="${x}" y="${y}" font-size="11" fill="${B}" font-family="var(--f-mono)" letter-spacing=".06em">${t}</text>`;
 const gen=k=>T(ARCH.gens[k].k).toUpperCase();
 let s=`<svg viewBox="0 0 900 430" role="img" aria-label="${esc(T(UI.archTitle))}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${G}"/></marker></defs>`;
 s+=tower(48,170)+tower(84,182)+`<path d="M30 236H104" stroke="${B}"/>`+`<text x="66" y="262" font-size="12" text-anchor="middle" fill="${I}">Grid</text><text x="66" y="278" font-size="11.5" text-anchor="middle" fill="${G}" font-family="var(--f-mono)">13 kV AC</text>`;
 s+=elbow("110,210 140,210 140,92 186,92","",0,0)+elbow("110,220 140,220 140,352 186,352","",0,0);
 s+=cab(190,48,112,88,"LFT",4)+tag(190,40,"MV TRANSFORMER");
 s+=cab(190,306,112,92,"SST",3)+tag(190,298,"SOLID-STATE");
 // Gen 2
 s+=arr(306,80,420,80,"480 VAC");
 s+=rack(424,26,54,118,["p","p","c","c","c","s","c","c","c"])+tag(492,40,gen(0))+`<text x="492" y="60" font-size="13" fill="${I}" font-weight="600">${esc(T(ARCH.gens[0].t))}</text><text x="492" y="78" font-size="11.5" fill="${G}" font-family="var(--f-mono)">50 VDC busbar · ~100 kW</text>`;
 // Gen 3
 s+=elbow("306,118 360,118 360,222 420,222","480 VAC",364,206);
 s+=rack(424,166,54,118,["p","p","p","p","p","p"])+`<text x="451" y="160" font-size="11.5" text-anchor="middle" fill="${I}">Sidecar</text>`;
 s+=arr(482,222,598,222,"800 / ±400 VDC");
 s+=rack(602,166,54,118,["c","c","c","s","c","c","c"])+tag(672,180,gen(1))+`<text x="672" y="200" font-size="13" fill="${I}" font-weight="600">${esc(T(ARCH.gens[1].t))}</text><text x="672" y="218" font-size="11.5" fill="${G}" font-family="var(--f-mono)">1 MW: ~20 kA → 1.25 kA</text>`;
 // Gen 4
 s+=arr(306,352,420,352,"800 VDC");
 s+=rack(424,300,66,124,["c","c","c","c","s","c","c","c","c"])+tag(504,316,gen(2))+`<text x="504" y="336" font-size="13" fill="${I}" font-weight="600">${esc(T(ARCH.gens[2].t))}</text><text x="504" y="354" font-size="11.5" fill="${G}" font-family="var(--f-mono)">MW-class rack</text>`;
 // key
 s+=`<rect x="704" y="372" width="14" height="9" fill="#fdebe3" stroke="${O}"/><text x="724" y="381" font-size="11.5" fill="${G}">Power shelf</text><rect x="704" y="392" width="14" height="9" fill="#fff" stroke="${B}"/><text x="724" y="401" font-size="11.5" fill="${G}">Compute / switch tray</text>`;
 return s+`</svg>`;
}
function renderArch(){
 const el=$("arch"); if(!S.arch){el.hidden=true; el.innerHTML=""; return;}
 el.hidden=false;
 el.innerHTML=`<div class="sh-top"><div><span class="pill">${esc(T(UI.archKick))}</span><h2>${esc(T(UI.archTitle))}</h2><p class="lede">${esc(T(UI.archLede))}</p></div><button class="rbtn ghost" id="archX" aria-label="${esc(T(UI.close))}">×</button></div>
 <div class="dia">${archSVG()}</div>
 <div class="gens3">${ARCH.gens.map(g=>`<div><span class="k">${esc(T(g.k))}</span><b>${esc(T(g.t))}</b><p>${esc(T(g.p))}</p></div>`).join("")}</div>
 <div class="legend">${ARCH.legend.map(l=>`<div><b>${l[0]}</b> · ${esc(T(l[1]))}</div>`).join("")}</div>
 <div class="case"><b>${esc(T(UI.caseK))}</b><p>${esc(T(UI.caseP))}</p></div>
 <div class="srcs"><div class="sh" style="font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">${esc(T(UI.sources))}</div>${srcList(["ti","vtv800","nv800","fox800"])}<p style="margin:6px 0 0;font-size:11.5px;color:var(--ink-3)">${esc(T({zh:"示意圖依上列文件的文字描述重繪並簡化；SST 架構為 TI 所列提案。",en:"Redrawn and simplified from the text of the documents above; the SST design is listed by TI as a proposal."}))}</p></div>`;
 $("archX").onclick=()=>openArch(false);
}
function openArch(on){S.arch=on; renderArch();}

/* guided tour */
function tourGo(i){
 S.tour=i; const st=TOUR[i].set;
 if(st.layers){Object.keys(S.layers).forEach(k=>S.layers[k]=st.layers.includes(k));}
 ["red","liquid","vdc","phase","room"].forEach(k=>{if(st[k]!==undefined) S[k]=st[k];});
 S.outage=st.outage?0:null; if(outTimer){clearInterval(outTimer);outTimer=null;}
 S.level=st.level; S.sel=TOUR[i].sel; S.scnCard=null; S.arch=!!st.arch;
 if(S.level===4){S.pull=null; S.explode=true; layoutRack(true);}
 syncPhase(); renderAll(true); updateExplodeBtn(); renderToast();
}
function syncPhase(){ANCHOR.expansion=V(170,S.phase===2?16:2,192);}
function endTour(){S.tour=null; S.outage=null; S.arch=false; renderToast(); renderAll(false);}
$("tourBtn").onclick=()=>tourGo(0);

/* header controls */
$("langSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.v; $("langSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); i18nStatic(); refreshLabelText(); renderAll(false); renderToast(); updateExplodeBtn();});

$("zIn").onclick=()=>{goal=null; flyTo(cam.target,clampSize(cam.size/1.45));};
$("zOut").onclick=()=>{goal=null; flyTo(cam.target,clampSize(cam.size*1.45));};
$("rotL").onclick=()=>flyTo(cam.target,cam.size,cam.az-Math.PI/2);
$("rotR").onclick=()=>flyTo(cam.target,cam.size,cam.az+Math.PI/2);
$("reset").onclick=()=>{const k=Math.round((cam.az-Math.PI/4)/(Math.PI*2)); const f=frameFor(); flyTo(V(f.t[0],f.t[1],f.t[2]),f.s*fitScale(),Math.PI/4+k*Math.PI*2);};
window.addEventListener("keydown",e=>{if(e.target.matches("input"))return; if(e.key>="0"&&e.key<="4") setLevel(+e.key); if(e.key==="Escape"){ if(S.arch) openArch(false); else select(null);}});

/* boot */
const LINKEDIN_URL=""; // e.g. https://www.linkedin.com/in/<handle>
if(LINKEDIN_URL){const li=$("liLink"); li.hidden=false; const a=li.querySelector("a"); a.href=LINKEDIN_URL; a.textContent=LINKEDIN_URL.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");}
build(); readHash();
$("langSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===S.lang));
i18nStatic(); refreshLabelText(); renderAll(false); updateExplodeBtn();
new ResizeObserver(()=>{resize();}).observe(stage); resize();
{const f=frameFor(); cam.target.set(f.t[0],f.t[1],f.t[2]); cam.size=f.s*fitScale();}
if(!webglOK){ $("info").innerHTML=`<div class="empty"><p>${esc(T({zh:"此瀏覽器無法啟用 WebGL，無法顯示 3D 模型。",en:"WebGL is unavailable in this browser, so the 3D model cannot be shown."}))}</p></div>`; }
requestAnimationFrame(tick);
</script>
